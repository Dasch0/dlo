{% extends "base.html" %}

{% block title %}Faction Statistics{% endblock %}
{% block header %}Faction Statistics{% endblock %}

{% block content %}
<div class="faction-stats">
    <div class="section">
        <h2>Monthly Faction Winrates</h2>
        <div class="chart-container">
            {{ monthly_plot|safe }}
        </div>
    </div>
</div>

<style>
.faction-stats {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.section {
    margin-bottom: 40px;
}

.chart-container {
    background: #2d2d2d;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
}

h2 {
    color: #e0e0e0;
    border-bottom: 2px solid #3498db;
    padding-bottom: 10px;
    margin-bottom: 20px;
}
</style>
{% endblock %}
